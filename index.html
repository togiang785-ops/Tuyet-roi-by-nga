<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anime Winter - Bích Nga</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
 overflow:hidden;
 font-family:Arial,sans-serif;
}

.scene{
 width:100%;
 height:100vh;
 position:relative;
 overflow:hidden;
 background:linear-gradient(#101c3c,#426b91,#b6dce9,#f4fbff);
}

/* Bầu trời */
.moon{
 position:absolute;
 top:8%;
 right:15%;
 width:85px;
 height:85px;
 border-radius:50%;
 background:#fff8dc;
 box-shadow:0 0 50px white;
 animation:glow 3s infinite alternate;
}
@keyframes glow{
 to{box-shadow:0 0 100px white}
}

.stars{
 position:absolute;
 inset:0;
 background-image:
 radial-gradient(white 1px,transparent 2px),
 radial-gradient(#d9f5ff 1px,transparent 2px);
 background-size:90px 90px,130px 130px;
 animation:stars 15s linear infinite;
}
@keyframes stars{
 to{background-position:90px 90px,-130px 130px}
}

/* Núi tuyết */
.mountain{
 position:absolute;
 bottom:29%;
 width:0;height:0;
 border-left:200px solid transparent;
 border-right:200px solid transparent;
 border-bottom:260px solid #b9d6e7;
}
.m1{left:-100px}
.m2{left:30%;transform:scale(1.3);border-bottom-color:#d9edf7}
.m3{right:-100px;border-bottom-color:#a9c6dc}

/* Nhà cửa */
.city{
 position:absolute;
 bottom:23%;
 width:100%;
 display:flex;
 justify-content:space-around;
 align-items:end;
}
.building{
 width:75px;
 height:110px;
 background:#354e70;
 border:2px solid #263d5c;
 position:relative;
}
.building:nth-child(2){height:155px}
.building:nth-child(3){height:95px}
.building:nth-child(4){height:135px}
.building:nth-child(5){height:115px}
.building:before{
 content:"▪ ▪ ▪\A ▪ ▪ ▪\A ▪ ▪ ▪";
 white-space:pre;
 color:#fff0a5;
 line-height:30px;
 position:absolute;
 left:12px;
 top:5px;
 text-shadow:0 0 8px yellow;
}

/* Mặt đất */
.ground{
 position:absolute;
 bottom:0;
 width:100%;
 height:26%;
 background:linear-gradient(#f1fbff,#c2e1ed);
}
.road{
 position:absolute;
 bottom:0;
 width:100%;
 height:95px;
 background:#344353;
}
.line{
 position:absolute;
 top:45px;
 width:100%;
 border-top:4px dashed white;
}

/* Xe ô tô */
.car{
 position:absolute;
 bottom:65px;
 left:-150px;
 width:110px;
 height:42px;
 background:#ed6674;
 border-radius:15px 25px 5px 5px;
 animation:drive 9s linear infinite;
 z-index:5;
}
.car:before{
 content:"";
 position:absolute;
 top:-25px;
 left:25px;
 width:55px;
 height:30px;
 background:#b9e9f5;
 border:3px solid #ed6674;
 border-radius:15px 15px 0 0;
}
.wheel{
 position:absolute;
 bottom:-9px;
 left:15px;
 width:20px;
 height:20px;
 background:#171b25;
 border:4px solid #aeb9c5;
 border-radius:50%;
}
.wheel.two{left:75px}
@keyframes drive{
 from{transform:translateX(0)}
 to{transform:translateX(calc(100vw + 250px))}
}

/* Xe thứ hai */
.car2{
 position:absolute;
 bottom:125px;
 left:110%;
 width:90px;
 height:32px;
 background:#5b9cda;
  border-radius:15px 20px 4px 4px;
 animation:drive2 12s linear infinite;
 animation-delay:3s;
}
@keyframes drive2{
 from{transform:translateX(0)}
 to{transform:translateX(calc(-100vw - 1200px))}
}

/* Người đi bộ */
.person{
 position:absolute;
 bottom:23%;
 left:20%;
 width:28px;
 height:75px;
 animation:walk .5s infinite alternate;
 z-index:4;
}
.head{
 position:absolute;
 top:0;left:3px;
 width:23px;height:23px;
 background:#f5c9a8;
 border-radius:50%;
}
.body{
 position:absolute;
 top:23px;left:3px;
 width:25px;height:32px;
 background:#bd4f6c;
 border-radius:8px;
}
.leg{
 position:absolute;
 top:52px;left:6px;
 width:8px;height:23px;
 background:#273c5c;
 transform-origin:top;
 animation:legs .5s infinite alternate;
}
.leg.right{left:17px;animation-delay:.25s}
@keyframes walk{
 to{transform:translateY(-3px)}
}
@keyframes legs{
 to{transform:rotate(25deg)}
}

/* Cây và hoa */
.tree{
 position:absolute;
 bottom:23%;
 font-size:75px;
 transform-origin:bottom;
 animation:sway 3s infinite alternate;
 z-index:3;
}
.t1{left:3%}
.t2{right:4%;animation-delay:1s}
@keyframes sway{
 to{transform:rotate(5deg)}
}

.flower{
 position:absolute;
 bottom:24%;
 font-size:30px;
 animation:flower 2s infinite alternate;
}
.f1{left:12%}
.f2{left:35%;animation-delay:.5s}
.f3{right:20%;animation-delay:1s}
.f4{right:10%;animation-delay:.3s}
@keyframes flower{
 to{transform:rotate(15deg) translateY(-8px)}
}

/* Tuyết rơi */
.snow{
 position:absolute;
 top:-20px;
 color:white;
 font-size:18px;
 animation:fall linear infinite;
 z-index:8;
 pointer-events:none;
}
@keyframes fall{
 0%{transform:translateY(-20px) translateX(0) rotate(0deg)}
 100%{transform:translateY(110vh) translateX(80px) rotate(360deg)}
}

/* Đèn đường */
.lamp{
 position:absolute;
 bottom:23%;
 left:55%;
 width:5px;
 height:125px;
 background:#263b51;
 z-index:3;
}
.lamp:before{
 content:"";
 position:absolute;
 top:0;left:-12px;
 width:30px;height:10px;
 background:#ffe9a6;
 border-radius:10px;
 box-shadow:0 0 25px 12px #ffe9a6;
}

/* Chữ */
.credit{
 position:absolute;
 bottom:13px;
 width:100%;
 text-align:center;
 color:white;
 font-size:22px;
 font-weight:bold;
 letter-spacing:2px;
 text-shadow:0 0 8px #287cae,0 0 18px #fff;
 z-index:20;
 animation:credit 2s infinite alternate;
}
@keyframes credit{
 to{transform:scale(1.06);text-shadow:0 0 20px #fff}
}

.caption{
 position:absolute;
 top:25%;
 width:100%;
 text-align:center;
 color:white;
 font-size:clamp(20px,4vw,38px);
 font-weight:bold;
 text-shadow:0 0 15px #a5dfff;
 animation:appear 3s infinite alternate;
 z-index:10;
}
@keyframes appear{
 to{letter-spacing:5px;opacity:.7}
}

</style>
</head>

<body>

<div class="scene">

 <div class="stars"></div>
 <div class="moon"></div>

 <div class="mountain m1"></div>
 <div class="mountain m2"></div>
 <div class="mountain m3"></div>

 <div class="city">
  <div class="building"></div>
  <div class="building"></div>
  <div class="building"></div>
  <div class="building"></div>
  <div class="building"></div>
 </div>

 <div class="caption">
  ❄ WINTER ANIME WORLD ❄
 </div>

 <div class="ground"></div>

 <div class="tree t1">🌲</div>
 <div class="tree t2">🌲</div>

 <div class="flower f1">🌸</div>
 <div class="flower f2">🌷</div>
 <div class="flower f3">🌼</div>
 <div class="flower f4">🌸</div>

 <div class="lamp"></div>

 <div class="person">
  <div class="head"></div>
  <div class="body"></div>
  <div class="leg"></div>
  <div class="leg right"></div>
 </div>

 <div class="road">
  <div class="line"></div>
 </div>

 <div class="car">
  <div class="wheel"></div>
  <div class="wheel two"></div>
 </div>

 <div class="car2"></div>

 <div class="credit">
  đc tạo bởi Bích Nga ❄
 </div>

</div>

<script>
// Tạo 100 bông tuyết chuyển động
for(let i=0;i<100;i++){
 let snow=document.createElement("div");
 snow.className="snow";
 snow.innerHTML=Math.random()>.5?"❄":"❅";
 snow.style.left=Math.random()*100+"%";
 snow.style.fontSize=(8+Math.random()*18)+"px";
 snow.style.opacity=.4+Math.random()*.6;
 snow.style.animationDuration=(4+Math.random()*9)+"s";
 snow.style.animationDelay=(-Math.random()*12)+"s";
 document.querySelector(".scene").appendChild(snow);
}
</script>

</body>
</html>
